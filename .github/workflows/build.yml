name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/magic/iptv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          cp app_build.gradle app/build.gradle
          cp debug.keystore app/debug.keystore
          cp AndroidManifest.xml app/src/main/
          cp *.java app/src/main/java/com/magic/iptv/
          cp strings.xml app/src/main/res/values/
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp banner.png app/src/main/res/drawable/banner.png
          cp ic_launcher_bg.xml app/src/main/res/drawable/ic_launcher_bg.xml
          cp ic_launcher_fg.png app/src/main/res/drawable/ic_launcher_fg.png
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ic_launcher_adaptive.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp index.html app/src/main/assets/
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MAGIC-APK
          path: app/build/outputs/apk/debug/*.apk
